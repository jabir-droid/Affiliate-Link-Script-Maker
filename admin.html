<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel - Affiliate Script Maker</title>
  <style>
    body {
      background: radial-gradient(circle at top, #0b132b, #1c2541);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      color: #ffffff;
      margin-bottom: 1.5rem;
    }
    .panel {
      background: rgba(255, 255, 255, 0.1);
      padding: 2rem;
      border-radius: 1rem;
      width: 90%;
      max-width: 450px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
    }
    input[type="password"] {
      width: 100%;
      padding: 0.8rem;
      border: none;
      border-radius: 0.5rem;
      margin-bottom: 1rem;
      font-size: 1rem;
      outline: none;
    }
    button {
      width: 100%;
      padding: 0.8rem;
      background: linear-gradient(90deg, #00b4d8, #48cae4);
      border: none;
      border-radius: 0.5rem;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0, 180, 216, 0.4);
    }
    .error {
      color: #ff9b9b;
      margin-top: 0.8rem;
      font-size: 0.9rem;
    }
    footer {
      position: absolute;
      bottom: 1rem;
      width: 100%;
      text-align: center;
      color: #9baec8;
      font-size: 0.85rem;
    }
    @media (max-width: 600px) {
      .panel {
        padding: 1.5rem;
      }
      h1 {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>
  <h1>⚙️ Admin Panel</h1>
  <div class="panel">
    <label for="adminKey"><strong>Masukkan Admin Key</strong></label>
    <input type="password" id="adminKey" placeholder="Ketik admin key Anda" />
    <button id="btnLogin">🔑 Masuk</button>
    <div class="error" id="err"></div>
  </div>
  <footer>
    © 2025 Affiliate Script Maker. All Rights Reserved. (Admin Use Only)
  </footer>

  <script>
    const keyInput = document.getElementById('adminKey');
    const errBox = document.getElementById('err');

    document.getElementById('btnLogin').addEventListener('click', async () => {
      errBox.textContent = '';
      const key = keyInput.value.trim();
      if (!key) {
        errBox.textContent = 'Admin key wajib diisi';
        return;
      }

      localStorage.setItem('aff_admin_key', key);

      try {
        // Tes koneksi _echo
        const echoResp = await fetch('/api/_echo', {
          headers: { 'x-admin-key': key }
        });
        const echoJson = await echoResp.json();
        if (!echoJson.ok) {
          errBox.textContent = 'Server tidak merespons dengan benar';
          return;
        }

        // Tes akses admin di /api/usage
        const r = await fetch('/api/usage', {
          headers: { 'x-admin-key': key }
        });

        if (!r.ok) {
          const j = await r.json().catch(() => ({ message: 'Unauthorized' }));
          errBox.textContent = `Gagal masuk: ${j.message || r.status}`;
          return;
        }

        // Jika sukses
        location.href = '/admin-dashboard.html';
      } catch (e) {
        errBox.textContent = 'Terjadi kesalahan koneksi';
      }
    });
  </script>
</body>
</html>
