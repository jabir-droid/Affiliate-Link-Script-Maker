<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0f172a; --panel:#1e293b;
      --txt:#e5e7eb; --muted:#94a3b8; --err:#f43f5e;
      --grad1:#05c3ff; --grad2:#31d0c6; --ring:rgba(255,255,255,.12);
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; display:grid; place-items:center; padding:20px;
      font-family:Inter,system-ui,Segoe UI,Roboto,Arial; color:var(--txt);
      background:
        radial-gradient(1200px 500px at 10% -10%, rgba(49,208,198,.18), transparent 60%),
        radial-gradient(1200px 520px at 90% 0%, rgba(5,195,255,.15), transparent 60%),
        var(--bg);
    }
    .card{
      width:min(680px,94vw); background:var(--panel); border:1px solid var(--ring);
      border-radius:18px; padding:28px; box-shadow:0 25px 55px rgba(0,0,0,.35);
    }
    h1{margin:0 0 18px; text-align:center; font-weight:800; letter-spacing:.2px}
    .row{display:grid; gap:12px}
    input{
      width:100%; padding:16px 18px; border-radius:12px; outline:none; border:1px solid var(--ring);
      background:#e8f1ff; color:#0f172a; font-size:18px; font-weight:600;
    }
    input:focus{box-shadow:0 0 0 4px rgba(49,208,198,.25)}
    button{
      width:100%; padding:16px; border-radius:14px; border:0; cursor:pointer;
      color:#06202a; font-weight:800; font-size:20px;
      background:linear-gradient(90deg,var(--grad1),var(--grad2));
      box-shadow:0 18px 45px rgba(5,195,255,.35);
      display:flex; align-items:center; justify-content:center; gap:10px;
      transition:transform .08s ease, filter .15s ease;
    }
    button:active{transform:translateY(1px)}
    .err{margin-top:14px; color:var(--err); text-align:center; font-weight:700}
    footer{margin-top:18px; text-align:center; color:var(--muted); font-size:14px}
  </style>
</head>
<body>
  <main class="card">
    <h1>Masukkan Admin Key</h1>
    <div class="row">
      <input id="adminKey" type="password" placeholder="Admin key" autocomplete="off" />
      <button id="btnLogin">🔑 Masuk</button>
      <div id="msg" class="err" style="display:none"></div>
    </div>
    <footer>© 2025 Affiliate Script Maker. All Rights Reserved. (Admin Use Only)</footer>
  </main>

  <script>
    const msg = document.getElementById('msg');
    function showErr(t){ msg.textContent=t; msg.style.display='block' }
    function hideErr(){ msg.textContent=''; msg.style.display='none' }

    async function login(){
      hideErr();
      const key = document.getElementById('adminKey').value.trim();
      if(!key){ showErr('Admin key wajib diisi'); return; }

      try{
        // Cek cepat: endpoint diagnostik (jika 404 berarti belum ter-deploy)
        const envCheck = await fetch('/api/_env-check', { cache:'no-store' });
        if(!envCheck.ok){
          showErr('Endpoint _env-check belum tersedia (Not Found). Deploy dulu.');
          return;
        }

        // Panggil /api/usage untuk verifikasi kunci admin
        const r = await fetch('/api/usage', { headers: { 'x-admin-key': key } });
        const text = await r.text();
        let j=null; try{ j = JSON.parse(text) }catch{}
        if(!r.ok || !j || j.ok!==true) throw new Error(j?.message || text || 'Server error');

        // Simpan sementara & arahkan ke halaman manajemen
        sessionStorage.setItem('ADMIN_KEY', key);
        location.href = '/admin-users.html'; // pastikan file ini ada
      }catch(e){
        const m = String(e.message||e);
        if(m.includes('Unauthorized')) showErr('Gagal masuk: Unauthorized');
        else if(m.includes('Not Found')) showErr('Endpoint belum ter-deploy (Not Found)');
        else showErr('Server tidak merespons dengan benar');
      }
    }
    document.getElementById('btnLogin').addEventListener('click', login);
    document.getElementById('adminKey').addEventListener('keydown', e=>{ if(e.key==='Enter') login() });
  </script>
</body>
</html>
