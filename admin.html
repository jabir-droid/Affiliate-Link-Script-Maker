<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin - Affiliate Script Maker</title>
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f9fafb;
      color: #222;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #111;
    }
    .card {
      max-width: 700px;
      background: #fff;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin: 20px auto;
    }
    input, button {
      font-size: 15px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      outline: none;
    }
    input {
      width: 100%;
      margin-bottom: 10px;
    }
    button {
      cursor: pointer;
      background: #0d6efd;
      color: white;
      border: none;
      transition: 0.2s;
    }
    button:hover { background: #0b5ed7; }
    .btn-red { background: #dc3545; }
    .btn-red:hover { background: #bb2d3b; }
    pre {
      background: #f4f4f4;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 13px;
    }
    .error {
      color: #c00;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <h1>Panel Admin</h1>

  <div class="card">
    <h3>Login Admin</h3>
    <p>Masukkan <b>ADMIN_SECRET</b> (dari environment Vercel) untuk autentikasi.</p>
    <input type="password" id="adminKey" placeholder="Masukkan admin secret...">
    <button id="saveKeyBtn">Simpan & Gunakan</button>
    <p id="loginMsg"></p>
  </div>

  <div class="card">
    <h3>Daftar User Terdaftar</h3>
    <button id="loadUsersBtn">Muat Daftar User</button>
    <ul id="usersList"></ul>
  </div>

  <div class="card">
    <h3>Tambah / Hapus User</h3>
    <input type="text" id="userName" placeholder="Nama pengguna (Lynk.id)">
    <button id="addUserBtn">Tambah User</button>
    <button id="delUserBtn" class="btn-red">Hapus User</button>
    <p id="userMsg"></p>
  </div>

  <div class="card">
    <h3>Statistik Pemakaian</h3>
    <button id="checkUsageBtn">Cek Pemakaian Hari Ini</button>
    <pre id="usageOutput">Belum ada data.</pre>
  </div>

  <script>
    const apiBase = "/api";
    let adminKey = localStorage.getItem("adminKey") || "";

    function setMsg(el, msg, isError = false) {
      el.textContent = msg;
      el.className = isError ? "error" : "";
    }

    // simpan admin key
    document.getElementById("saveKeyBtn").onclick = () => {
      const keyInput = document.getElementById("adminKey");
      adminKey = keyInput.value.trim();
      if (!adminKey) return alert("Masukkan ADMIN_SECRET!");
      localStorage.setItem("adminKey", adminKey);
      setMsg(document.getElementById("loginMsg"), "✅ Kunci admin disimpan di browser lokal.");
      keyInput.value = "";
    };

    // load users
    document.getElementById("loadUsersBtn").onclick = async () => {
      const list = document.getElementById("usersList");
      list.innerHTML = "Memuat...";
      try {
        const res = await fetch(`${apiBase}/admin/users`, { headers: { "x-admin-key": adminKey } });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.message || res.statusText);
        list.innerHTML = "";
        if (!data.users?.length) {
          list.innerHTML = "<li>(Belum ada user)</li>";
        } else {
          for (const name of data.users) {
            const li = document.createElement("li");
            li.textContent = name;
            list.appendChild(li);
          }
        }
      } catch (err) {
        list.innerHTML = `<li class='error'>❌ ${err.message}</li>`;
      }
    };

    // tambah user
    document.getElementById("addUserBtn").onclick = async () => {
      const name = document.getElementById("userName").value.trim().toLowerCase();
      const msg = document.getElementById("userMsg");
      if (!name) return setMsg(msg, "Nama tidak boleh kosong", true);
      try {
        const res = await fetch(`${apiBase}/admin/users`, {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-admin-key": adminKey },
          body: JSON.stringify({ name })
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.message || res.statusText);
        setMsg(msg, "✅ User berhasil ditambahkan: " + data.added);
      } catch (err) {
        setMsg(msg, "❌ " + err.message, true);
      }
    };

    // hapus user
    document.getElementById("delUserBtn").onclick = async () => {
      const name = document.getElementById("userName").value.trim().toLowerCase();
      const msg = document.getElementById("userMsg");
      if (!name) return setMsg(msg, "Nama tidak boleh kosong", true);
      if (!confirm("Yakin hapus user " + name + "?")) return;
      try {
        const res = await fetch(`${apiBase}/admin/users`, {
          method: "DELETE",
          headers: { "Content-Type": "application/json", "x-admin-key": adminKey },
          body: JSON.stringify({ name })
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.message || res.statusText);
        setMsg(msg, "✅ User dihapus: " + data.removed);
      } catch (err) {
        setMsg(msg, "❌ " + err.message, true);
      }
    };

    // cek usage
    document.getElementById("checkUsageBtn").onclick = async () => {
      const out = document.getElementById("usageOutput");
      out.textContent = "Memuat...";
      try {
        const res = await fetch(`${apiBase}/usage`, { headers: { "x-admin-key": adminKey } });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.message || res.statusText);
        out.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        out.textContent = "❌ " + err.message;
      }
    };
  </script>
</body>
</html>
