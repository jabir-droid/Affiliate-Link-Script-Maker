<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login — Script Engine AI</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
/* --- descender safety for letters like g, y, p in large headings --- */
.descender-safe{
  display:inline-block;
  line-height: 1.12;
  padding-bottom: .15em;
  transform: translateY(-0.03em);
}

/* --- touch/hover/active feedback for inputs --- */
.inp{
  transition: box-shadow .18s ease, border-color .18s ease, background-color .18s ease, transform .12s ease;
}
.inp:hover{
  border-color:#7c5cff;
  background:#ffffff;
}
.inp:active{
  transform: translateY(1px);
}

/* (Sisa CSS proyek login) */
:root{
  --bg:#0b0b10;
  --card:#12121a;
  --soft:#1a1a25;
  --pri:#7c5cff;
  --txt:#eaeaf2;
  --mut:#9aa0ac;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans";
  background: radial-gradient(1200px 700px at 20% -10%, #181828 0%, transparent 60%), var(--bg);
  color:var(--txt);
}
.wrap{
  min-height:100dvh;
  display:grid; place-items:center; padding:24px;
}
.card{
  width:min(520px, 92vw);
  background:linear-gradient(180deg,#12121a,#0f0f16);
  border:1px solid #222338;
  border-radius:16px; padding:22px 18px 18px;
  box-shadow:0 18px 44px rgba(0,0,0,.28);
}
.center{text-align:center}
h1{
  margin:8px 0 6px;
  font-size: clamp(28px, 4.4vw, 40px);
  background:linear-gradient(180deg,#fff,#d9dbe6);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
p.sub{color:var(--mut); margin:0 0 18px}
.row{display:grid; gap:10px; margin:12px 0}
.lbl{font-size:14px; color:#b7bcc8}
.inp{
  width:100%; padding:12px 12px; border-radius:12px;
  border:1px solid #2a2b44; background:#0e0f1c; color:var(--txt);
  outline: none;
}
.inp:focus{
  border-color:#7c5cff; box-shadow:0 0 0 3px rgba(124,92,255,.18);
  background:#0f1020;
}
.actions{display:flex; gap:10px; justify-content:space-between; align-items:center; margin-top:8px}
.btn{
  padding:12px 16px; border-radius:12px; border:1px solid #26273a;
  background:linear-gradient(180deg,#171726,#0f1020);
  box-shadow:0 10px 26px rgba(0,0,0,.28);
  font-weight:600; letter-spacing:.2px;
  transition: transform .12s ease, box-shadow .2s ease, border-color .2s ease, background .2s ease;
}
.btn:hover{ transform: translateY(-1px); border-color:#2f3150; box-shadow:0 16px 34px rgba(124,92,255,.15) }
.btn:active{ transform: translateY(1px) }
.btn.primary{
  background:linear-gradient(180deg,#7c5cff,#5b42ff);
  border-color:#6a54ff;
  box-shadow:0 14px 36px rgba(124,92,255,.35);
}
.btn.primary:hover{ box-shadow:0 18px 42px rgba(124,92,255,.42) }
.btn.primary:active{ transform: translateY(1px) }
.note{color:#8f95a3; font-size:12.5px; text-align:center; margin-top:14px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="center">
        <h1 class="title-grad title-size font-extrabold descender-safe">Login</h1>
        <p class="sub">Masuk untuk mulai menghasilkan skrip afiliasi otomatis.</p>
      </div>

      <form method="post" action="/api/me">
        <div class="row">
          <label class="lbl" for="email">Email</label>
          <input id="email" name="email" type="email" class="inp" placeholder="nama@domain.com" required />
        </div>
        <div class="row">
          <label class="lbl" for="pass">Kata sandi</label>
          <input id="pass" name="password" type="password" class="inp" placeholder="••••••••" required />
        </div>

        <div class="actions">
          <a class="btn" href="index.html">Kembali</a>
          <button class="btn primary" type="submit">Masuk</button>
        </div>
      </form>

      <div class="note">© 2025 – Dilarang Menduplikasi dan Menyebarluaskan Tanpa Izin Pemilik.</div>
    </div>
  </div>
</body>
</html>
