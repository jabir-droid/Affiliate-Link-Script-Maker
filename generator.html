<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Generator Uji</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; background:#0f172a; color:#e2e8f0; margin:0; padding:24px; }
    .wrap { max-width: 820px; margin: 0 auto; }
    h1 { font-size: 28px; margin: 4px 0 16px; }
    label { display:block; margin:14px 0 6px; font-weight:600; }
    input, textarea { width:100%; padding:12px 14px; border-radius:10px; border:1px solid #334155; background:#0b1220; color:#e2e8f0; }
    .btn { display:inline-block; margin-top:16px; padding:14px 18px; border-radius:16px; border:none; font-weight:700; font-size:16px;
           background: linear-gradient(90deg,#00b3ff,#6d5cff); color:white; cursor:pointer; width:100%; }
    .card { background:#0b1220; border:1px solid #243042; border-radius:16px; padding:16px 18px; margin:16px 0; }
    .title { font-size:20px; font-weight:800; margin-bottom:8px; }
    .error { color:#ef4444; margin-top:10px; font-weight:600; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🔧 Uji /api/generate</h1>

    <label>Link Produk</label>
    <input id="link" placeholder="https://contoh.com/produk" value="https://example.com/p/123" />

    <label>Nama/Jenis Produk</label>
    <input id="topik" placeholder="Tecno Spark Go 2" value="Tecno Spark Go 2" />

    <label>Kelebihan (pisahkan dengan koma)</label>
    <input id="desc" placeholder="tahan air, harga bersahabat" value="tahan air, harga bersahabat" />

    <label>Jumlah variasi</label>
    <input id="jumlah" type="number" min="1" max="8" value="3" />

    <button id="go" class="btn">✨ Mulai Hasilkan</button>
    <div id="err" class="error"></div>

    <div id="out"></div>
  </div>

  <script>
    const $ = (s) => document.querySelector(s);
    const out = $('#out');
    const err = $('#err');

    async function generate(payload) {
      const r = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type':'application/json' },
        body: JSON.stringify(payload)
      });
      if (!r.ok) {
        const t = await r.text().catch(()=> '');
        throw new Error(`${r.status} ${r.statusText} — ${t || 'request failed'}`);
      }
      return r.json();
    }

    $('#go').addEventListener('click', async () => {
      err.textContent = '';
      out.innerHTML = '';

      const linkProduk = $('#link').value.trim();
      const topik = $('#topik').value.trim();
      const deskripsi = $('#desc').value.split(',').map(s => s.trim()).filter(Boolean);
      const jumlah = Number($('#jumlah').value || 3);

      try {
        const res = await generate({ linkProduk, topik, deskripsi, jumlah });
        if (!res?.ok) throw new Error(res?.message || 'Gagal');

        for (const s of res.scripts || []) {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `<div class="title">${s.title}</div><div style="white-space:pre-wrap">${s.content}</div>`;
          out.appendChild(card);
        }
      } catch (e) {
        err.textContent = String(e.message || e);
      }
    });
  </script>
</body>
</html>
