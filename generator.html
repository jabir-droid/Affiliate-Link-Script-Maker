<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Generator — Buat Skrip Afiliasi</title>
  <style>
    :root{
      --bg:#0f172a; --card:#0b1225; --muted:#8aa0c7; --text:#e6eeff;
      --primaryA:#10b5ff; --primaryB:#7a5af8; --danger:#ff4d4d;
      --chip:#e8f1ff; --chipText:#1f2d4d;
    }
    *{box-sizing:border-box}
    body{
      margin:0;background:
        radial-gradient(1200px 600px at 10% -10%, #1a2652 0%, transparent 50%),
        radial-gradient(1200px 600px at 110% 0%, #1b2a60 0%, transparent 50%),
        radial-gradient(900px 400px at 50% 120%, #172048 0%, transparent 50%),
        var(--bg);
      color:var(--text); font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial
    }
    .wrap{max-width:980px;margin:28px auto;padding:0 16px}
    .title{display:flex;gap:10px;align-items:center;margin:6px 0 4px}
    .title h1{margin:0;font-size:28px;letter-spacing:.3px}
    .panel{background:linear-gradient(180deg,#0d1631 0%, #0a1329 100%);
      border:1px solid #12204c;border-radius:18px;padding:18px 18px 6px;
      box-shadow:0 10px 40px rgba(0,0,0,.35)}
    .panel h3{margin:0 0 16px;font-size:16px;color:#cdd8f8}
    label.small{display:block;font-size:13px;color:#9db0d9;margin:10px 0 6px}
    .in{width:100%;padding:14px 14px;border-radius:12px;border:1px solid #203266;
      background:#0b1430;color:var(--text);outline:none}
    .in:focus{border-color:#2f56ff;box-shadow:0 0 0 3px rgba(53,108,255,.18)}
    .row{display:grid;grid-template-columns:1fr auto;gap:10px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
      padding:12px 16px;border-radius:12px;border:0;color:white;cursor:pointer}
    .btn-grad{width:100%;
      background:linear-gradient(90deg,var(--primaryA),var(--primaryB));
      box-shadow:0 12px 40px rgba(102,122,255,.35)}
    .btn:disabled{opacity:.6;cursor:not-allowed}
    .chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
    .chip{display:inline-flex;align-items:center;gap:8px;background:var(--chip);
      color:var(--chipText);padding:8px 12px;border-radius:999px;font-size:13px}
    .chip button{all:unset; cursor:pointer; color:#48608f}
    .hint{font-size:12px;color:#88a0ce;margin-top:6px}
    .tools{display:flex;flex-wrap:wrap; gap:10px; margin:12px 0}
    .pill{padding:10px 14px;border-radius:12px;background:#0d193b;border:1px solid #213064;
      color:#cfe0ff;cursor:pointer;user-select:none}
    .pill.active{background:#172453;border-color:#2f56ff;box-shadow:0 0 0 2px rgba(53,108,255,.18)}
    .danger{color:var(--danger)}
    .results{margin-top:22px;display:grid;gap:16px}
    .card{background:linear-gradient(180deg,#0d1631 0%, #0a1329 100%);
      border:1px solid #19295a;border-radius:16px;padding:16px}
    .card h4{margin:0 0 8px}
    .card .actions{display:flex;gap:10px;margin-top:10px}
    .btn-outline{background:#0f1a3a;border:1px solid #28418a}
    .msg{margin-top:10px;font-size:14px}
    .center{display:flex;justify-content:center;align-items:center}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="title">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
        <path d="M12 2l2.39 4.84 5.34.78-3.86 3.77.91 5.31-4.78-2.51-4.78 2.51.91-5.31L4.27 7.62l5.34-.78L12 2z" fill="#76b3ff"/>
      </svg>
      <h1>AI Generator</h1>
    </div>

    <div class="panel">
      <h3>Form Input Produk</h3>

      <label class="small">Link Produk *</label>
      <input id="link" class="in" type="url" placeholder="https://tokopedia.com/..." />

      <label class="small">Nama / Jenis Produk *</label>
      <input id="topik" class="in" type="text" placeholder="Contoh: Smartwatch X Pro" />

      <label class="small">Kelebihan / Keunggulan Produk *</label>
      <div class="row">
        <input id="featInput" class="in" type="text" placeholder="Contoh: Tahan Air IP68, Baterai 7 Hari" />
        <button id="btnAddFeat" class="btn btn-outline">+ Tambah</button>
      </div>
      <div id="chips" class="chips"></div>
      <div class="hint">Minimal <b>2</b> kelebihan. Tekan <i>Enter</i> atau klik <b>+ Tambah</b> untuk menambah.</div>

      <label class="small">Jumlah Variasi Konten</label>
      <input id="jumlah" class="in" type="number" min="1" max="10" value="3" />

      <div class="tools">
        <div class="pill active" data-group="style" data-val="Santai & Ramah">Santai & Ramah</div>
        <div class="pill" data-group="style" data-val="Formal & Informatif">Formal & Informatif</div>
        <div class="pill" data-group="style" data-val="Promosi Soft Selling">Promosi Soft Selling</div>
        <div class="pill" data-group="style" data-val="AIDA/PAS">Penulisan Naskah Iklan (AIDA/PAS)</div>
      </div>

      <div class="tools">
        <div class="pill" data-group="length" data-val="Pendek">Pendek (1 paragraf)</div>
        <div class="pill active" data-group="length" data-val="Sedang">Sedang (2–3 paragraf)</div>
        <div class="pill" data-group="length" data-val="Panjang">Panjang (artikel mini)</div>
      </div>

      <div class="center" style="margin:18px 0 2px">
        <button id="btnGen" class="btn btn-grad" style="width:100%;height:56px;font-size:18px;">
          ✨ Mulai Hasilkan
        </button>
      </div>
      <div id="msg" class="msg"></div>
    </div>

    <div id="results" class="results"></div>
  </div>

<script>
(() => {
  const el = (sel, root=document) => root.querySelector(sel);
  const els = (sel, root=document) => Array.from(root.querySelectorAll(sel));
  const link   = el('#link');
  const topik  = el('#topik');
  const featIn = el('#featInput');
  const chipsC = el('#chips');
  const jumlah = el('#jumlah');
  const btnAdd = el('#btnAddFeat');
  const btnGen = el('#btnGen');
  const msg    = el('#msg');
  const results= el('#results');

  let features = [];

  // ---------- pill select ----------
  els('.pill').forEach(p => {
    p.addEventListener('click', () => {
      const group = p.getAttribute('data-group');
      els(`.pill[data-group="${group}"]`).forEach(x => x.classList.remove('active'));
      p.classList.add('active');
    });
  });

  function activeVal(group){
    const a = el(`.pill[data-group="${group}"].active`);
    return a ? a.getAttribute('data-val') : '';
  }

  // ---------- chips ----------
  function renderChips(){
    chipsC.innerHTML = '';
    features.forEach((t, i) => {
      const div = document.createElement('div');
      div.className = 'chip';
      div.innerHTML = `<span>${escapeHtml(t)}</span><button title="hapus">&times;</button>`;
      div.querySelector('button').onclick = () => {
        features.splice(i,1);
        renderChips();
      };
      chipsC.appendChild(div);
    });
  }
  function addFeat(){
    const v = (featIn.value || '').trim();
    if(!v) return;
    if(!features.includes(v)) features.push(v);
    featIn.value = '';
    renderChips();
  }
  featIn.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){ e.preventDefault(); addFeat(); }
  });
  btnAdd.addEventListener('click', (e) => {
    e.preventDefault(); addFeat();
  });

  // ---------- helper ----------
  function setMsg(text, type=''){
    msg.innerHTML = text ? (type==='err' ? `<span class="danger">${escapeHtml(text)}</span>` : escapeHtml(text)) : '';
  }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[m])); }
  function copyText(s){
    navigator.clipboard?.writeText(s).catch(()=>{});
  }

  // ---------- render hasil ----------
  function showResults(items){
    results.innerHTML = '';
    items.forEach((it, idx) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <h4>${escapeHtml(it.title || `Variasi ${idx+1}`)}</h4>
        <div class="content" style="white-space:pre-wrap;color:#dce6ff">${escapeHtml(it.content || '')}</div>
        <div class="actions">
          <button class="btn btn-outline" data-act="copy">Salin</button>
          <button class="btn btn-outline" data-act="edit">Edit</button>
        </div>
      `;
      card.querySelector('[data-act="copy"]').onclick = () => {
        const text = card.querySelector('.content').textContent;
        copyText(text);
      };
      card.querySelector('[data-act="edit"]').onclick = async () => {
        const cur = card.querySelector('.content').textContent;
        const next = prompt('Edit konten:', cur);
        if(next != null) card.querySelector('.content').textContent = next;
      };
      results.appendChild(card);
    });
  }

  // ---------- generate ----------
  btnGen.addEventListener('click', async () => {
    setMsg('');
    results.innerHTML = '';

    const payload = {
      linkProduk: (link.value || '').trim(),
      topik:      (topik.value || '').trim(),
      deskripsi:  features.slice(0),
      gaya:       activeVal('style') || 'Santai & Ramah',
      panjang:    activeVal('length') || 'Sedang',
      jumlah:     Math.max(1, Math.min(10, Number(jumlah.value || 1)))
    };

    // Validasi
    if(!payload.linkProduk) return setMsg('Link produk wajib diisi', 'err');
    if(!payload.topik)      return setMsg('Nama/Jenis produk wajib diisi', 'err');
    if(payload.deskripsi.length < 2) return setMsg('Minimal 2 kelebihan/keunggulan.', 'err');

    btnGen.disabled = true; btnGen.textContent = '⏳ Memproses...';
    try{
      const r = await fetch('/api/generate', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(payload)
      });

      let dataText = await r.text();
      let data;
      try{ data = JSON.parse(dataText); }catch{ data = { ok:false, message:dataText || 'Invalid JSON' }; }

      if(!r.ok || !data.ok){
        // 404 => fungsi belum ada
        if(r.status === 404){
          setMsg('Not Found — Pastikan fungsi /api/generate sudah ada di server (file api/generate.js).', 'err');
        }else{
          setMsg(data.message || 'Gagal memproses permintaan.', 'err');
        }
        return;
      }

      const items = Array.isArray(data.scripts) ? data.scripts : [];
      if(!items.length) { setMsg('Tidak ada hasil dikembalikan.', 'err'); return; }
      showResults(items);
      setMsg(`Berhasil menghasilkan ${items.length} variasi.`);
    }catch(e){
      setMsg(String(e?.message || e), 'err');
    }finally{
      btnGen.disabled = false; btnGen.textContent = '✨ Mulai Hasilkan';
    }
  });
})();
</script>
</body>
</html>
